<!DOCTYPE html>
<html>
<head>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #2c3130; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: sans-serif; }
.card { width: 280px; }
.dots { display: flex; justify-content: center; gap: 14px; margin-bottom: 24px; }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #7a8280; background: transparent; transition: all 0.15s; }
.dot.on { background: #c9a96e; border-color: #c9a96e; }
.numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.k { height: 52px; border-radius: 10px; background: #3f4543; border: 1px solid rgba(255,255,255,0.07); color: #f0f5f3; font-size: 18px; cursor: pointer; }
.k:active { background: #505655; }
#msg { color: #9aa2a0; font-size: 12px; text-align: center; margin-bottom: 16px; letter-spacing: 0.1em; text-transform: uppercase; }
</style>
</head>
<body>
<div class="card">
  <div id="msg">Access PIN</div>
  <div class="dots">
    <div class="dot" id="d0"></div>
    <div class="dot" id="d1"></div>
    <div class="dot" id="d2"></div>
    <div class="dot" id="d3"></div>
  </div>
  <div class="numpad">
    <button class="k" onclick="p('1')">1</button>
    <button class="k" onclick="p('2')">2</button>
    <button class="k" onclick="p('3')">3</button>
    <button class="k" onclick="p('4')">4</button>
    <button class="k" onclick="p('5')">5</button>
    <button class="k" onclick="p('6')">6</button>
    <button class="k" onclick="p('7')">7</button>
    <button class="k" onclick="p('8')">8</button>
    <button class="k" onclick="p('9')">9</button>
    <button class="k" onclick="del()">⌫</button>
    <button class="k" onclick="p('0')">0</button>
    <button class="k" style="opacity:0;pointer-events:none"></button>
  </div>
</div>
<script>
var pin = '';
function p(d) {
  if (pin.length >= 4) return;
  pin += d;
  update();
  if (pin.length === 4) { document.getElementById('msg').textContent = 'PIN: ' + pin; }
}
function del() { pin = pin.slice(0,-1); update(); }
function update() {
  for (var i=0;i<4;i++) document.getElementById('d'+i).className = 'dot' + (i < pin.length ? ' on' : '');
}
</script>
</body>
</html>
